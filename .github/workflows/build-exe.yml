# On every push to main:
#   1. release-please reads the Conventional Commits (feat:, fix:, feat!:) and keeps a
#      "release X.Y.Z" PR up to date (version bump + CHANGELOG.md). Merging that PR
#      creates the tag vX.Y.Z and the GitHub Release.
#   2. The Windows .exe is built and smoke-tested (PyInstaller does not cross-compile).
#   3. If step 1 just created a release, the .exe is attached to it.
# Everything lives in one workflow because tags created with GITHUB_TOKEN do not
# trigger other workflows.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: false  # never cancel a run that may still have to attach the exe to a release

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    needs: release-please
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Check release tag matches the version
        if: needs.release-please.outputs.release_created == 'true'
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $version = python -c "import ludotek; print(ludotek.__version__)"
          if ("v$version" -ne $env:TAG) {
            throw "Le tag $env:TAG ne correspond pas à ludotek.__version__ ($version)."
          }

      - name: Build
        shell: pwsh
        run: ./script/build.ps1

      # Starts the exe on a tiny games folder: catches a missing UI or font file.
      - name: Smoke test
        shell: pwsh
        run: |
          $games = Join-Path $env:RUNNER_TEMP "games"
          New-Item -ItemType Directory -Force -Path (Join-Path $games "Test Game") | Out-Null
          $proc = Start-Process -FilePath "dist\Ludotek.exe" -ArgumentList "`"$games`"", "--no-browser" -PassThru -WindowStyle Hidden
          $base = "http://127.0.0.1:8765"
          try {
            $page = $null
            for ($i = 0; $i -lt 30 -and -not $page; $i++) {
              Start-Sleep -Seconds 1
              try { $page = Invoke-WebRequest -UseBasicParsing "$base/" } catch {}
            }
            if (-not $page) { throw "L'exe ne répond pas sur $base." }
            if ($page.Content -notmatch "<title>Ludotek</title>") { throw "Page inattendue." }
            foreach ($f in "app.js", "style.css", "fonts/host-grotesk.woff2", "fonts/instrument-sans.woff2") {
              Invoke-WebRequest -UseBasicParsing "$base/$f" | Out-Null
            }
            $lib = Invoke-RestMethod "$base/api/library"
            if (-not ($lib.items | Where-Object name -eq "Test Game")) { throw "Le dossier de test n'a pas été scanné." }
            $token = [regex]::Match($page.Content, 'biblio-token" content="([^"]+)"').Groups[1].Value
            Invoke-RestMethod -Method Post "$base/api/quit" -Headers @{ "X-Biblio-Token" = $token } -ContentType "application/json" -Body "{}" | Out-Null
            if (-not $proc.WaitForExit(10000)) { throw "L'exe ne s'est pas arrêté après Quitter." }
            Write-Host "Smoke test OK"
          }
          finally {
            # A onefile exe runs as a parent + child process: kill the whole tree if still alive.
            taskkill /PID $proc.Id /T /F 2>$null | Out-Null
            # taskkill fails when the exe already stopped: that must not fail the step.
            # (A test failure above is an exception, so it still fails the step.)
            $global:LASTEXITCODE = 0
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Ludotek-${{ github.sha }}
          path: dist/Ludotek.exe
          if-no-files-found: error
          retention-days: 30  # dev builds from main; releases keep their own copy

  attach:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the exe to the release created above
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ludotek-${{ github.sha }}

      - name: Attach exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" Ludotek.exe --repo "$GITHUB_REPOSITORY" --clobber
